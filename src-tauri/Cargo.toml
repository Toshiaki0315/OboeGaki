[package]
name = "oboegaki"
default-run = "oboegaki"
version = "0.5.20"
description = "覚書 — ライブプレビュー型 Markdown エディタ"
authors = ["NOMURA Toshiaki"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "oboegaki_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 計測ツールは**束ねる .app に入れない**（実測 2026-09-06: 何もしないと
# Contents/MacOS/ に bench が同梱される）。features で切っておくと、
# 既定の `cargo build` で作られないので bundler も拾いようがない。
# 走らせるのは make bench-search（--features bench を付ける）。
[features]
bench = []

[[bin]]
name = "bench"
path = "src/bin/bench.rs"
required-features = ["bench"]

[[bin]]
name = "oboegaki"
path = "src/main.rs"

# MCP サーバ（ADR-0051）。同じライブラリを stdio で開く第 2 のバイナリ
[[bin]]
name = "oboegaki-mcp"
path = "src/bin/mcp.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# image-png: 「覚書について」に渡す絵を PNG から読むため（menu の AboutMetadata）
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27.0"
tauri-plugin-dialog = "2.7.3"
unicode-normalization = "0.1.25"
notify = "8.2.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
base64 = "0.23.1"
chrono = "0.4.45"
sha1 = "0.11.0"
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-window-state = "2.4.1"
objc2-vision = "0.3.2"
objc2-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2 = "0.6.4"
tauri-plugin-clipboard-manager = "2.3.3"
objc2-core-foundation = "0.3.2"
encoding_rs = "0.8.35"
objc2-image-io = { version = "0.3.2", features = ["CGImageDestination"] }
tauri-plugin-global-shortcut = "2.3.2"
rmcp = { version = "3.3.0", features = ["server", "transport-io", "macros", "schemars"] }
schemars = "1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std"] }

[dev-dependencies]
tempfile = "3.27.0"

