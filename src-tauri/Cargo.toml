[package]
name = "oboegaki"
default-run = "oboegaki"
version = "0.1.0"
description = "覚書 — ライブプレビュー型 Markdown エディタ"
authors = ["NOMURA Toshiaki"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "oboegaki_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# image-png: 「覚書について」に渡す絵を PNG から読むため（menu の AboutMetadata）
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27.0"
tauri-plugin-dialog = "2.7.3"
unicode-normalization = "0.1.25"
notify = "8.2.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
base64 = "0.23.1"
chrono = "0.4.45"
sha1 = "0.11.0"
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-window-state = "2.4.1"
objc2-vision = "0.3.2"
objc2-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2 = "0.6.4"
tauri-plugin-clipboard-manager = "2.3.3"
objc2-core-foundation = "0.3.2"

[dev-dependencies]
tempfile = "3.27.0"

