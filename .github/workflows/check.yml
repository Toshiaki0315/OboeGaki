# make check と同じ内容を CI で回す。
# ランナーは macos-14（Apple Silicon）— 対象プラットフォームが macOS のみ
# （ADR-0012）なので、Linux 用の WebKit 依存を入れるより速くて確実。
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      # 24 は現行の LTS。手元（Homebrew）は 25 だが、奇数系統は寿命が短く
      # 既に更新が止まっているので CI では追わない。依存の engines も
      # `^22.13.0 || >=24` の形が多く、24 が素直に通る線
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx prettier --check src
      - run: npx eslint . --max-warnings 0
      - run: npx vitest run
      - run: npx tsc --noEmit

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: cargo fmt --check
        working-directory: src-tauri
      # 計測ツール（bench）は features で切ってある（.app に入れないため）。
      # CI では付けて lint も通す。--all-targets でテストの中も見る（15-3）
      - run: cargo clippy --features bench --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri
